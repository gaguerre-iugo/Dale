.adt-skin::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;background:#e3202a;z-index:2}
.adt-skin:has([data-section-type="activity_other"])::before{display:none!important}
.adt-skin *{box-sizing:border-box}
.adt-skin p,.adt-skin span,.adt-skin div,.adt-skin li,.adt-skin a,.adt-skin button,.adt-skin input,.adt-skin select,.adt-skin textarea,.adt-skin label,.adt-skin figcaption{font-family:'ADTArimo',system-ui,sans-serif!important}
.adt-skin > section,.adt-skin > div#content{max-width:1100px!important;margin:0 auto!important;background:#fff!important;border:3px solid #1d1d1d!important;border-radius:22px!important;box-shadow:0 16px 34px rgba(0,0,0,.18)!important;padding:clamp(16px,3vw,40px)!important;min-height:1560px!important;width:100%!important;overflow:hidden}
.adt-skin > div#content:has(section.adt-page-open){background:transparent!important;border:0!important;box-shadow:none!important;min-height:0!important;padding:0!important;overflow:visible!important}
.adt-skin section.adt-page-open div:has(.adt-bloccard){display:flex!important;flex-direction:column!important;gap:36px!important}
.adt-skin > div#content > section{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;max-width:100%!important;min-height:0!important}
.adt-skin h1,.adt-skin h2,.adt-skin h3,.adt-skin h4{font-family:'ADTArchivo','ADTArimo',sans-serif!important;text-transform:uppercase;letter-spacing:.045em;font-weight:800!important;line-height:1.12;color:#6d6a54!important}
.adt-skin .adt-label-plain{text-transform:none!important;font-weight:500!important;font-size:1.05rem!important;letter-spacing:0!important;color:#4b5563!important;font-family:'ADTArimo',system-ui,sans-serif!important}
.adt-skin .adt-label-red{text-transform:none!important;font-weight:700!important;font-size:1.15rem!important;letter-spacing:0!important;color:#e3202a!important;font-family:'ADTArimo',system-ui,sans-serif!important}
.adt-skin .adt-notepad p{font-size:1.15rem!important;line-height:1.5!important}
.adt-skin [class*="border-dashed"]{border-color:#ef3b35!important}
/* fondos -> blanco (coincidencia exacta de clase para no tocar bg-red-500) */
.adt-skin [class~="bg-[#bdefff]"]{background:#e9e2d2!important}
.adt-skin [class~="bg-gray-50"],.adt-skin [class~="bg-gray-100"],.adt-skin [class~="bg-slate-50"],.adt-skin [class~="bg-amber-50"],.adt-skin [class~="bg-amber-100"],.adt-skin [class~="bg-red-50"],.adt-skin [class~="bg-[#f8f7ef]"],.adt-skin [class~="bg-green-100"]{background:#fff!important}

.adt-skin [class*="text-white"]{color:#fff!important}
.adt-skin [class*="border-amber-"],.adt-skin [class*="border-gray-200"],.adt-skin [class*="border-gray-300"],.adt-skin [class*="border-slate-200"],.adt-skin [class*="border-neutral-"]{border-color:#ddd6c8!important}

/* las cartas de memoria las pone punteadas su propio script: forzar sólido como pg009 */
.adt-skin .memory-card{border-style:solid!important}
.adt-skin [class*="border-[#ef6b63]"]{border-color:#1d1d1d!important}
/* quitar el anillo rojizo que el script agrega al abrir una carta (parecia "incorrecto") */
.adt-skin .memory-card{--tw-ring-color:transparent!important}
.adt-skin [class*="ring-[#ef6a61]"]{--tw-ring-color:transparent!important;box-shadow:none!important}
.adt-skin .memory-card .card-front img{max-height:100%!important;height:100%!important;width:100%!important;object-fit:contain!important}
/* el cartel de "pareja encontrada" no debe cambiar el alto de la carta */
.adt-skin .memory-card > span{position:relative!important}
.adt-skin .memory-card .matched-badge{position:absolute!important;left:0!important;right:0!important;bottom:2px!important;justify-content:center!important;margin:0!important}
.adt-skin img{max-height:110px!important;height:auto!important;width:auto!important;max-width:100%!important;object-fit:contain!important}

.adt-skin [data-adt-num]{color:#fff!important}

.adt-skin [class~="whitespace-pre-line"]{white-space:pre-line!important}

.adt-skin [data-section-type="activity_custom_multi_select_audio"] .adt-grid > *{overflow:hidden!important}
.adt-skin [data-section-type="activity_custom_multi_select_audio"] [class~="h-[58%]"]{height:76%!important;width:76%!important}
.adt-skin [data-section-type="activity_custom_sound_selection"] .adt-grid img{max-height:150px!important;width:100%!important}

  <script>
    (function () {
      const section = document.currentScript.closest('section');
      if (!section || section.dataset.adtInitialized === 'true') return;
      section.dataset.adtInitialized = 'true';

      const cards = Array.from(section.querySelectorAll('[data-activity-item]'));
      const status = section.querySelector('[data-activity-status]');
      const matchCount = section.querySelector('[data-match-count]');
      let firstCard = null;
      let secondCard = null;
      let lockBoard = false;
      let pairsFound = 0;
      const totalPairs = 8;

      const synth = window.speechSynthesis || null;

      const speakName = function (name) {
        if (!synth || !name) return;
        try {
          synth.cancel();
          const utterance = new SpeechSynthesisUtterance(name);
          utterance.lang = 'es-ES';
          synth.speak(utterance);
        } catch (e) {}
      };

      const normalizeInitial = function (value) {
        return (value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .trim()
          .charAt(0)
          .toUpperCase();
      };

      const setStatus = function (message, ok) {
        if (!status) return;
        status.textContent = message;
        status.classList.remove('text-green-700', 'text-[#ef3b35]');
        status.classList.add(ok ? 'text-green-700' : 'text-[#ef3b35]');
      };

      const updateAria = function (card, state) {
        const name = card.dataset.name || 'tarjeta';
        if (state === 'matched') {
          card.setAttribute('aria-label', name + ', pareja encontrada');
        } else if (state === 'open') {
          card.setAttribute('aria-label', name + ', tarjeta abierta');
        } else {
          card.setAttribute('aria-label', 'Tarjeta, boca abajo');
        }
      };

      const showCard = function (card) {
        const front = card.querySelector('[data-card-front]');
        const back = card.querySelector('[data-card-back]');
        if (front) front.classList.add('hidden');
        if (back) back.classList.remove('hidden');
        card.dataset.state = 'open';
        card.classList.add('ring-4', 'ring-[#ef6a61]/40');
        updateAria(card, 'open');
        speakName(card.dataset.name);
      };

      const hideCard = function (card) {
        const front = card.querySelector('[data-card-front]');
        const back = card.querySelector('[data-card-back]');
        if (front) front.classList.remove('hidden');
        if (back) back.classList.add('hidden');
        card.dataset.state = 'hidden';
        card.classList.remove('ring-4', 'ring-[#ef6a61]/40', 'border-green-600', 'bg-green-50');
        updateAria(card, 'hidden');
      };

      const markMatched = function (card) {
        card.dataset.state = 'matched';
        card.disabled = true;
        card.classList.remove('ring-4', 'ring-[#ef6a61]/40');
        card.classList.add('border-green-600', 'bg-green-50');
        const back = card.querySelector('[data-card-back]');
        if (back && !back.querySelector('.activity-feedback-icon')) {
          const iconWrap = document.createElement('span');
          iconWrap.className = 'activity-feedback-icon absolute right-3 top-3 inline-flex h-11 min-w-11 items-center justify-center rounded-full bg-green-600 px-3 text-white font-extrabold';
          iconWrap.setAttribute('aria-label', 'Correcto');
          iconWrap.textContent = '✓';
          back.classList.add('relative');
          back.appendChild(iconWrap);
        }
        updateAria(card, 'matched');
      };

      const clearUnmatchedFeedback = function () {
        cards.forEach(function (card) {
          if (card.dataset.state !== 'matched') {
            card.classList.remove('border-[#ef3b35]', 'bg-[#fff1ef]');
          }
        });
      };

      const finishTurn = function () {
        firstCard = null;
        secondCard = null;
        lockBoard = false;
      };

      const handleCardSelection = function (card) {
        if (lockBoard) return;
        if (!card || card.dataset.state === 'matched' || card === firstCard) return;

        clearUnmatchedFeedback();
        showCard(card);

        if (!firstCard) {
          firstCard = card;
          setStatus('Elegiste la primera tarjeta.', false);
          return;
        }

        secondCard = card;
        lockBoard = true;

        const firstInitial = normalizeInitial(firstCard.dataset.initial || firstCard.dataset.name);
        const secondInitial = normalizeInitial(secondCard.dataset.initial || secondCard.dataset.name);

        if (firstInitial && secondInitial && firstInitial === secondInitial) {
          markMatched(firstCard);
          markMatched(secondCard);
          pairsFound += 1;
          if (matchCount) matchCount.textContent = String(pairsFound);
          const won = pairsFound === totalPairs;
          setStatus(won ? '¡Correcto! Encontraste todas las parejas.' : '✓ Muy bien. Las dos palabras empiezan con la misma letra.', true);
          finishTurn();
          return;
        }

        firstCard.classList.add('border-[#ef3b35]', 'bg-[#fff1ef]');
        secondCard.classList.add('border-[#ef3b35]', 'bg-[#fff1ef]');
        setStatus('✗ No coinciden. Las tarjetas se darán vuelta otra vez.', false);
        window.setTimeout(function () {
          hideCard(firstCard);
          hideCard(secondCard);
          finishTurn();
        }, 1100);
      };

      cards.forEach(function (card) {
        card.dataset.state = 'hidden';
        updateAria(card, 'hidden');
        card.addEventListener('click', function () {
          handleCardSelection(card);
        });
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleCardSelection(card);
          }
        });
      });

      window.adtRegisterCustomActivity(section, {
        validate: function () {
          const passed = pairsFound === totalPairs;
          setStatus(passed ? '¡Correcto! Encontraste todas las parejas.' : 'Sigue jugando. Encuentra todas las parejas para completar la actividad.', passed);
          return passed;
        },
        reset: function () {
          if (synth) {
            try { synth.cancel(); } catch (e) {}
          }
          firstCard = null;
          secondCard = null;
          lockBoard = false;
          pairsFound = 0;
          if (matchCount) matchCount.textContent = '0';
          cards.forEach(function (card) {
            card.disabled = false;
            const icon = card.querySelector('.activity-feedback-icon');
            if (icon) icon.remove();
            hideCard(card);
          });
          if (status) {
            status.textContent = '';
            status.classList.remove('text-green-700', 'text-[#ef3b35]');
          }
        }
      });
    })();
  </script>
